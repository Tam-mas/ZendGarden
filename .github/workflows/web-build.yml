name: Build browser game
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: web-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test browser asset loader
        run: node tests/web_loader.cjs
      - name: Export and package for Cloudflare Pages
        run: python3 tools/build_web.py
      - name: Verify deployable files
        run: python3 tests/check_web_build.py
      - uses: actions/upload-artifact@v4
        with:
          name: zend-garden-pages
          path: build/web
          retention-days: 3
