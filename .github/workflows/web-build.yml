name: Build browser game
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: web-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Check audio loop assets
        run: python3 tests/check_audio.py
      - name: Test browser asset loader
        run: node tests/web_loader.cjs
      - name: Test garden migration relay and save validation
        run: node tests/migration.cjs
      - name: Export and package for Cloudflare Pages
        run: python3 tools/build_web.py
      - name: Check garden path junctions
        run: |
          python3 tests/check_path_paving.py
          python3 tests/check_connecting_trail.py
      - name: Test garden paths and moving water
        run: .web-tools/Godot_v4.7.2-stable_linux.x86_64 --headless --fixed-fps 60 --path . -- --trail-polish-test
      - name: Check flower assets and collection navigation
        run: |
          python3 tests/check_flower_additions.py
          .web-tools/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script tests/flower_collection.gd
          .web-tools/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script tests/flower_additions.gd
      - name: Check imported audio quality
        run: .web-tools/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script tests/audio_compression.gd
      - name: Test garden milestones and removable displays
        run: .web-tools/Godot_v4.7.2-stable_linux.x86_64 --headless --fixed-fps 60 --path . -- --milestones-test
      - name: Test continuous garden land and walking seams
        run: .web-tools/Godot_v4.7.2-stable_linux.x86_64 --headless --fixed-fps 60 --path . -- --land-test
      - name: Test garden save files
        run: .web-tools/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script tests/save_files.gd
      - name: Verify deployable files
        run: |
          python3 tests/check_web_build.py
          python3 tests/check_security_build.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zend-garden-pages
          path: build/web
          retention-days: 3
