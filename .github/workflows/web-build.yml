name: Build browser game
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: web-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Check audio loop assets
        run: python3 tests/check_audio.py
      - name: Test browser asset loader
        run: node tests/web_loader.cjs
      - name: Export and package for Cloudflare Pages
        run: python3 tools/build_web.py
      - name: Verify deployable files
        run: |
          python3 tests/check_web_build.py
          python3 tests/check_security_build.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zend-garden-pages
          path: build/web
          retention-days: 3
