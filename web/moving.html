<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <title>A new cozy home · Zend Garden</title>
  <link rel="stylesheet" href="/migration.css">
</head>
<body data-moving="true">
  <section id="migration" aria-labelledby="move-title">
    <div class="migration-card">
      <p class="move-sprig" aria-hidden="true">❧</p>
      <h1 id="move-title">A new cozy home</h1>
      <p>Your little garden is moving to its new cozy home at zend.garden.</p>
      <p id="move-status" role="status">Gently gathering your garden…</p>
      <noscript><p>Please enable JavaScript to carry your saved garden across.</p><a href="/?stay=1">Keep gardening here</a></noscript>
    </div>
  </section>
  <script type="module" src="/migration.js"></script>
</body>
</html>
